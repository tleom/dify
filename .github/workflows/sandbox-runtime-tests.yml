name: Sandbox Runtime Tests

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: sandbox-runtime-tests-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  workbench-manager:
    name: Workbench Manager Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'

      - name: Test workspace files and container migration
        run: >-
          uv run --no-project --with pytest==9.0.2 python -m pytest
          workbench/tests/test_file_ops.py
          workbench/tests/test_file_directories.py
          workbench/tests/test_manager_migration.py -q

  sandbox-runtime-unit:
    name: Sandbox Runtime Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dify-agent-runtime/go.mod
          cache-dependency-path: dify-agent-runtime/go.sum

      - name: Run unit tests
        run: go test -race -count=1 ./...

  sandbox-runtime-lint:
    name: Sandbox Runtime Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dify-agent-runtime/go.mod
          cache-dependency-path: dify-agent-runtime/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: dify-agent-runtime
          version: latest

  sandbox-runtime-integration:
    name: Sandbox Runtime Integration Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: dify-agent-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: dify-agent-runtime/go.mod
          cache-dependency-path: dify-agent-runtime/go.sum

      - name: Build and start runtime
        run: make integration-up

      - name: Run integration tests
        run: make integration-test

      - name: Dump container logs on failure
        if: failure()
        run: make integration-logs || true

      - name: Stop runtime container
        if: always()
        run: make integration-down
