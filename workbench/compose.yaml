name: dify-workbench

# Private env files, databases and storage are provisioned separately. This file
# describes the application services without embedding credentials or database dumps.
x-api: &api
  image: dify-workbench-api:1.17.0-20260910.1
  restart: unless-stopped
  volumes:
    - ${WORKBENCH_CONFIG_DIR:?Set the private configuration directory}/storage:/app/api/storage
    - ${WORKBENCH_CONFIG_DIR}/mcp_tools_manage_service.py:/app/api/services/tools/mcp_tools_manage_service.py:ro
  networks: [backend]

services:
  wb-api:
    <<: *api
    container_name: wb-api
    env_file: ${WORKBENCH_CONFIG_DIR}/api.env
    networks: [backend, sandboxes]
  wb-worker:
    <<: *api
    container_name: wb-worker
    env_file: ${WORKBENCH_CONFIG_DIR}/worker.env
  wb-control:
    <<: *api
    container_name: wb-control
    env_file: ${WORKBENCH_CONFIG_DIR}/control.env
  wb-beat:
    <<: *api
    container_name: wb-beat
    env_file: ${WORKBENCH_CONFIG_DIR}/beat.env
  wb-agent:
    image: dify-workbench-agent:1.17.0-20260910.1
    container_name: wb-agent
    restart: unless-stopped
    env_file: ${WORKBENCH_CONFIG_DIR}/agent.env
    networks: [backend, sandboxes]
  wb-manager:
    image: dify-workbench-manager:20260910.1
    container_name: wb-manager
    restart: unless-stopped
    env_file: ${WORKBENCH_CONFIG_DIR}/manager.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ${WORKBENCH_CONFIG_DIR}/manager-state:/state
    networks: [backend]
  wb-web:
    image: dify-workbench-web:33085b66-20260910
    container_name: wb-web
    restart: unless-stopped
    env_file: ${WORKBENCH_CONFIG_DIR}/frontend.env
    ports: ["${WORKBENCH_BIND_IP:-127.0.0.1}:3100:3100"]
    networks: [backend]

networks:
  backend:
    external: true
    name: dify-workbench-backend
  sandboxes:
    external: true
    name: dify-workbench-sandboxes
